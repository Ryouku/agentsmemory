# agentsmemory — self-hosted, one person, one machine.
#
# ONE service. The server runs in --local mode (one workspace, no token, no
# dashboard) and indexes search with chromem, an embedded vector database that
# lives inside this process and stores its files in the volume below — so there
# is no second container to run, wait for, or back up separately.
#
# Ollama is deliberately NOT a service either: most people already run it on the
# host or point at a shared box, and a second copy would re-download several GB
# of models. See .env.docker.example for both cases — and pull the embedding
# model first (`ollama pull bge-m3`), or every write fails at the embed step.
#
#   cp .env.docker.example .env.docker
#   docker compose up -d
#   claude mcp add --transport http agentsmemory http://localhost:8080/mcp
#
# Registering the MCP is only half of it — see the README: without the memory
# protocol installed into your agent, the tools are available but never called.

name: agentsmemory

services:
  agentsmemory:
    build: .
    image: agentsmemory:local
    restart: unless-stopped
    env_file: .env.docker
    # --addr :8080 binds every interface INSIDE the container, which is required
    # for a published port to reach it — the loopback default local mode uses on
    # a host would make the container unreachable. The boundary here is the ports
    # entry below, which publishes to the host's loopback only. The server logs a
    # non-loopback warning on boot because it cannot see that; in this file it is
    # expected, not a misconfiguration. (Setting AGENTSMEMORY_LOCAL_TOKEN in
    # .env.docker replaces that warning with a line confirming the token gate.)
    command: ["serve", "--local", "--addr", ":8080", "--db", "/data/agentsmemory.db"]
    ports:
      # 127.0.0.1: is load-bearing. /mcp is UNAUTHENTICATED in local mode, so
      # publishing as "8080:8080" would hand every device on your network full
      # read and write access to your memory. Override the host port (not the
      # interface) with AGENTSMEMORY_HOST_PORT — Compose reads that one from your
      # shell or a .env file beside this one, NOT from .env.docker, which is
      # passed to the container rather than interpolated here.
      #
      # To serve other machines deliberately, set AGENTSMEMORY_LOCAL_TOKEN in
      # .env.docker FIRST (the server picks it up with no change to command:
      # above), and only then widen this to "8080:8080". The token is what makes
      # the wider publish safe; without it, widening is the mistake this comment
      # exists to prevent.
      - "127.0.0.1:${AGENTSMEMORY_HOST_PORT:-8080}:8080"
    volumes:
      # Holds both halves: /data/agentsmemory.db (the SQLite source of truth,
      # everything you remember) and /data/agentsmemory.chromem (the search
      # index, derived from it — the server refills it from SQLite on boot if it
      # is ever missing). One volume to back up, not two.
      - agentsmemory-data:/data
    extra_hosts:
      # Linux has no host.docker.internal; this maps it to the host gateway so
      # one OLLAMA_URL works on Linux, macOS and Windows alike. Harmless where
      # Docker Desktop already provides the name.
      - "host.docker.internal:host-gateway"

  # Want Qdrant instead? It is the right call once the palace is large enough
  # that an in-process index costs real memory, or when several machines must
  # share one index. Uncomment this service and the qdrant-data volume, add
  # `depends_on: [qdrant]` to the service above, then set VECTOR_BACKEND=qdrant
  # and QDRANT_URL=http://qdrant:6333 in .env.docker.
  #
  # depends_on is start ORDER, not readiness: on a cold first boot the server can
  # win the race and exit with "ensure local vector namespace: ... connection
  # refused". That is what restart: unless-stopped above is for — it comes up on
  # the retry, and a single-user stack does not need a healthcheck.
  #
  # Vectors already written stay safe either way: SQLite is the source of truth,
  # so after switching run `docker compose run --rm agentsmemory sync` to replay
  # them into Qdrant without re-embedding.
  #
  # qdrant:
  #   image: qdrant/qdrant:v1.15.0
  #   restart: unless-stopped
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   ports:
  #     # Loopback-only as well: this port is unauthenticated unless you set a
  #     # Qdrant API key. Drop it entirely if you do not want the web UI at
  #     # http://localhost:6333/dashboard — the server reaches Qdrant over the
  #     # compose network either way.
  #     - "127.0.0.1:6333:6333"

volumes:
  agentsmemory-data:
  # qdrant-data:
