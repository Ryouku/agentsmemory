name: deploy

# Deploys the released container image to the host running the hosted service
# (docker-compose.prod.yml — the multi-tenant shape behind aiagentmemory.dev).
# Gated on the same strict vX.Y.Z tag as build.yml/release.yml (identical check
# job; each workflow is independent). Deploying a release is the DEFAULT: every
# strict tag rolls the host. It still must never break a release, so the deploy
# job skips green (with a notice) while the host secrets DEPLOY_HOST,
# DEPLOY_USER, DEPLOY_SSH_KEY are unset (optionally DEPLOY_PORT, default 22,
# and DEPLOY_DIR, default /opt/agentsmemory), and the operator can force it off
# by setting the repository VARIABLE DEPLOY_ENABLED=false (kill switch).
#
# The host needs Docker and a one-time docker-compose.prod.yml + .env.prod
# (see README "Hosted mode & billing"): the workflow fetches the compose file
# from this repo if missing and rolls the exact released image tag (GHCR tags
# strip the leading v: git v0.0.75 → image 0.0.75). .env.prod carries the
# environment — session key, OAuth, BILLING_PROVIDER + OPENCOLLECTIVE_* — and
# is operator-managed; this workflow only swaps the image.
#
# release.yml builds the image on the same tag push, so this job polls the
# registry until the new tag is pullable, then probes /healthz and rolls back
# to the previously-running tag if the new one never answers.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Strict version-tag gate, mirroring release.yml. Emits release=true only for
  # a full vX.Y.Z tag, so the deploy job skips loose tags (v1, v1.2, v1.2.3-rc1).
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.semver.outputs.release }}
    steps:
      - id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Deploying $tag"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=skipped::$tag is not a strict vX.X.X tag; skipping deploy."
          fi

  deploy:
    needs: check
    # Default-on for every strict release tag. The guard step below skips green
    # while the host secrets are unset, so an unconfigured deploy never breaks
    # a release. vars.DEPLOY_ENABLED=false is the operator's explicit opt-out.
    if: needs.check.outputs.release == 'true' && vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Guard - skip (never fail) while the host is unconfigured
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice title=deploy skipped::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY secrets unset; set them so releases auto-deploy (DEPLOY_ENABLED=false opts out)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Roll the released image
        if: steps.guard.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/agentsmemory' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GITHUB_REF_NAME, DEPLOY_DIR
          script: |
            set -euo pipefail
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            COMPOSE="docker compose -f docker-compose.prod.yml"

            if [ ! -f docker-compose.prod.yml ]; then
              curl -fsSL "https://raw.githubusercontent.com/atvirokodosprendimai/agentsmemory/main/docker-compose.prod.yml" -o docker-compose.prod.yml
            fi
            if [ ! -f .env.prod ]; then
              echo "missing .env.prod — copy .env.example and set session key, OAuth and billing (see README 'Hosted mode & billing')" >&2
              exit 1
            fi

            # GHCR tags strip the leading v from the git tag (v0.0.75 → 0.0.75).
            export AGENTSMEMORY_IMAGE_TAG="${GITHUB_REF_NAME#v}"

            # Rollback safety net: remember the image ref the live container is
            # currently running (e.g. ghcr.io/...:0.0.74) before we swap it. Empty
            # on a fresh host (nothing running yet), so the rollback branch no-ops.
            cid="$($COMPOSE ps -q agentsmemory || true)"
            prev_img=""
            [ -n "$cid" ] && prev_img="$(docker inspect --format '{{.Config.Image}}' "$cid" 2>/dev/null || true)"

            # release.yml builds and publishes the image on the SAME tag push, so
            # the new tag may not be pullable yet when we arrive. Poll the pull —
            # idempotent, instant once present — with a bounded wait (~10 min) so
            # a fresh tag never races the image build; a manual re-run benefits too.
            ready=""
            for attempt in $(seq 1 40); do
              if $COMPOSE pull agentsmemory; then
                ready=1
                echo "image ${AGENTSMEMORY_IMAGE_TAG} available (attempt ${attempt})"
                break
              fi
              echo "image ${AGENTSMEMORY_IMAGE_TAG} not yet published (attempt ${attempt}/40); waiting 15s"
              sleep 15
            done
            [ -n "$ready" ] || { echo "image never became available; aborting" >&2; exit 1; }

            $COMPOSE up -d --remove-orphans agentsmemory

            # Liveness gate: /healthz answers 200 once the server has bound its port.
            ok=""
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 5
            done

            if [ -n "$ok" ]; then
              docker image prune -f >/dev/null 2>&1 || true
              echo "deployed agentsmemory:${AGENTSMEMORY_IMAGE_TAG}"
            else
              echo "health check failed after up; rolling back" >&2
              if [ -n "$prev_img" ] && [ "${prev_img##*:}" != "${AGENTSMEMORY_IMAGE_TAG}" ]; then
                AGENTSMEMORY_IMAGE_TAG="${prev_img##*:}" $COMPOSE up -d --remove-orphans agentsmemory
                echo "rolled back to ${prev_img}"
              fi
              exit 1
            fi
