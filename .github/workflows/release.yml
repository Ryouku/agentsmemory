name: release

# Build and publish the container image ONLY on a full semantic-version tag like
# v1.2.3 — never on v1, v1.2, or pre-release tags such as v1.2.3-rc1.
#
# The tag filter below is a GLOB (GitHub Actions does not support regex here).
# "v*.*.*" already excludes v1 and v1.2 because it requires two dots, but a glob
# cannot assert "digits only / exactly three parts" — so the `check` job does the
# strict regex match and gates the build accordingly.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # write: upload the CLI and server binaries as release assets
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.semver.outputs.release }}
    steps:
      - id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Building release for $tag"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=skipped::$tag is not a strict vX.X.X tag; skipping build."
          fi

  image:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Release builds must pass tests.
      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags from the git tag: the exact version plus "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cross-compile the two raw, un-archived binaries and attach them to the
  # GitHub Release under a predictable `<name>-<goos>-<goarch>` asset name, so a
  # plain curl (or the curl|bash install.sh) can fetch the right one for the
  # user's OS/arch without unpacking an archive first:
  #
  #   aiagentmemory-<goos>-<goarch>         the installer/CLI (./clients/claude-code)
  #   aiagentmemory-server-<goos>-<goarch>  the server itself  (./cmd/server)
  #
  # The server also ships as a versioned tar.gz/zip from the sibling build.yml
  # (which additionally covers windows/amd64 and emits SHA256SUMS.txt); this job
  # deliberately duplicates it as a raw binary because README's `--local`
  # quickstart tells the reader to run `./agentsmemory` directly, and a raw asset
  # is what makes that a one-line download.
  #
  # Neither package needs cgo — SQLite is pure Go via modernc — so a static
  # CGO_ENABLED=0 build cross-compiles every target on the one linux runner.
  binaries:
    # Depend on `image` (not just `check`) so the release binaries publish only
    # after that job's `go test ./...` passes — untested binaries must not ship.
    needs: [check, image]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build aiagentmemory CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="aiagentmemory-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./clients/claude-code
          echo "cli_asset=$out" >>"$GITHUB_ENV"

      # No -X version stamp here, unlike the CLI above: ./cmd/server has no
      # main.version symbol to write into, and the linker would silently discard
      # the flag — leaving a stamp that looks authoritative but does nothing.
      # This mirrors build.yml, which builds the same package with plain -s -w.
      - name: Build agentsmemory server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="aiagentmemory-server-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w" \
            -o "$out" ./cmd/server
          echo "server_asset=$out" >>"$GITHUB_ENV"

      # fail_on_unmatched_files turns a vanished asset into a red release rather
      # than a quietly incomplete one — the failure mode that matters now that
      # install.sh and the README both point at fixed asset names.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ env.cli_asset }}
            ${{ env.server_asset }}
